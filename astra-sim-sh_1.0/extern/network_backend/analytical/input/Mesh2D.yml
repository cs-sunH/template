# Network Configuration

# 2D mesh topology, expressed as two non-wrapping line dimensions
topology: [ Line, Line ]  # Ring, Switch, FullyConnected, Mesh, Line

# 4 x 4 = 16 NPUs
npus_count: [ 4, 4 ]  # number of NPUs per dimension

# Bandwidth per each dimension
bandwidth: [ 50.0, 50.0 ]  # GB/s

# Latency per each dimension
latency: [ 500.0, 500.0 ]  # ns
